spring.application.name=skywatch-api

# Database: defaults for local development, overridden by environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skywatch}
spring.datasource.username=${DB_USER:skywatch}
spring.datasource.password=${DB_PASSWORD:skywatch}
spring.sql.init.mode=always

# Monitoring on a separate port, never exposed publicly
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# Business settings (FR-02, FR-04, FR-05)
skywatch.separation.horizontal-nm=5
skywatch.separation.vertical-ft=1000
skywatch.prediction.horizon-seconds=300
skywatch.positions.max-age-seconds=600
spring.datasource.hikari.connection-timeout=5000
